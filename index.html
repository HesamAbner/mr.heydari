<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازی آقای حیدری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --amber:#f4a259; --red:#e63946; --cream:#f1faee; --line:#3a3f6b; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0d0f22; font-family:'Vazirmatn',sans-serif; color:var(--cream); padding:20px; }
  h1{font-size:1.3rem; margin:0 0 12px;}
  .wrap{position:relative; width:min(92vw,640px);}
  canvas{ width:100%; display:block; border:3px solid var(--line); border-radius:10px; touch-action:none; }
  .hud{ position:absolute; top:10px; left:14px; right:14px; display:flex; justify-content:space-between;
    font-family:'Press Start 2P',monospace; font-size:.6rem; color:var(--amber); pointer-events:none; }
  .progress{ position:absolute; top:0; left:0; right:0; height:5px; background:rgba(255,255,255,.15); }
  .progress i{ display:block; height:100%; background:var(--amber); width:0%; transition:width .15s; }
  .banner{ position:absolute; top:50%; left:50%; transform:translate(-50%,-40%); opacity:0; text-align:center;
    background:rgba(0,0,0,.55); color:#fff; padding:14px 22px; border-radius:10px; font-weight:700;
    transition:all .25s ease; pointer-events:none; }
  .banner.show{ opacity:1; transform:translate(-50%,-50%); pointer-events:all; }
  .banner button{ margin-top:10px; }
  .banner small{ display:block; margin-top:4px; font-weight:400; opacity:.8; }
  .bar{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  button{ font-family:'Vazirmatn',sans-serif; font-weight:700; cursor:pointer; border:none;
    background:var(--amber); color:#1b1f3b; padding:9px 16px; border-radius:8px; font-size:.9rem; }
  button.ghost{ background:transparent; border:2px solid var(--line); color:var(--cream); }
  button:active{ transform:translateY(1px); }
  .hint{ margin-top:8px; font-size:.75rem; opacity:.65; text-align:center; }
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:5; }
  .modal.open{ display:flex; }
  .panel{ background:#0d0f22; border:2px solid var(--line); border-radius:12px; padding:22px 24px; width:min(90vw,340px); }
  .row{ margin:14px 0; display:flex; flex-direction:column; gap:6px; }
  select, input[type=range]{ width:100%; }
</style>
</head>
<body>
<h1>🏙️ آقای حیدری در شهر</h1>
<div class="wrap">
  <div class="progress"><i id="prog"></i></div>
  <canvas id="game" width="640" height="220"></canvas>
  <div class="hud"><span id="lvl">مرحله ۱</span><span id="score">۰۰۰۰</span><span id="best">رکورد: ۰</span></div>
  <div class="banner" id="banner">
    <span id="bannerText">آقای حیدری کشته شد</span>
    <small id="bannerSub"></small>
    <div><button id="retryBtn">🔁 شروع دوباره</button></div>
  </div>
</div>
<div class="bar">
  <button id="pauseBtn">⏸ توقف</button>
  <button class="ghost" id="settingsBtn">⚙ تنظیمات</button>
  <button class="ghost" id="downloadBtn">⭳ دانلود بازی</button>
</div>

<div class="modal" id="modal">
  <div class="panel">
    <h2>تنظیمات</h2>
    <div class="row"><label>صدا</label><input type="range" id="volume" min="0" max="100" value="60"></div>
    <div class="row"><label>سطح سختی</label>
      <select id="difficulty"><option value="0.85">آسان</option><option value="1" selected>عادی</option><option value="1.35">سخت</option></select>
    </div>
    <div class="row"><label><input type="checkbox" id="graphics" checked> جزئیات گرافیکی</label></div>
    <div class="bar">
      <button id="closeSettings">تایید</button>
      <button class="ghost" id="resetProgress">شروع از مرحله ۱</button>
    </div>
  </div>
</div>

<script>
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'), lvlEl=document.getElementById('lvl'), bestEl=document.getElementById('best');
const banner=document.getElementById('banner'), bannerText=document.getElementById('bannerText'), bannerSub=document.getElementById('bannerSub');
const prog=document.getElementById('prog');
const toFa = n => String(n).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

const face=new Image(); let faceLoaded=false;
face.onload=()=>faceLoaded=true; face.src='face.png';

let audioCtx;
function beep(freq,dur,type='square'){
  if(document.getElementById('volume').value==0) return;
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=document.getElementById('volume').value/100*0.2;
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
}
// old-school arcade background loop
const MELODY=[392,392,523,392,440,392,349,392];
let musicTimer=null, noteIdx=0;
function startMusic(){ if(musicTimer) return; musicTimer=setInterval(()=>{ beep(MELODY[noteIdx%MELODY.length],0.15,'square'); noteIdx++; },200); }
function stopMusic(){ clearInterval(musicTimer); musicTimer=null; }

// worlds: cycle every 10 levels
const WORLDS=[
  {sky1:'#1b1f3b',sky2:'#0d0f22',building:'#2a2f55',window:'#f4a259',road:'#232750'},
  {sky1:'#3b1b2f',sky2:'#1a0d16',building:'#552a44',window:'#ffd166',road:'#2a1522'},
  {sky1:'#123a2e',sky2:'#081b16',building:'#1f5c47',window:'#a0e8af',road:'#0e2a21'},
  {sky1:'#2b2140',sky2:'#140f24',building:'#4a3a78',window:'#ff9ecf',road:'#1c1530'},
  {sky1:'#3a2410',sky2:'#1a0f06',building:'#6b4423',window:'#ffe08a',road:'#241505'},
];
function worldFor(level){ return WORLDS[Math.floor((level-1)/10) % WORLDS.length]; }

let best=Number(localStorage.getItem('hbBest')||0);
let unlocked=Number(localStorage.getItem('hbLevel')||1);
bestEl.textContent='رکورد: '+toFa(best);

let dust=[];
function spawnDust(x,y){ for(let i=0;i<24;i++) dust.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*4-2,life:30+Math.random()*15}); }

let state;
function freshState(level){
  return { level, paused:false, dead:false, cleared:false, gravity:0.9, speed:6,
    playerY:170, vy:0, jumping:false, playerX:60, playerSize:40, legPhase:0,
    obstacles:[], frame:0, score:0, target:260+level*45, groundOffset:0,
    student:null, studentSpawned:false };
}
function newRun(level){ state=freshState(level); banner.classList.remove('show'); }
newRun(unlocked);

function spawnObstacle(){
  const w=46+Math.random()*24, h=26+Math.random()*8;
  state.obstacles.push({x:cv.width+10, y:170+38-h, w, h, color: Math.random()<.5 ? '#e63946':'#457b9d'});
}

function jump(){
  if(state.dead || state.cleared){ newRun(state.dead? unlocked : state.level+1); return; }
  if(!state.jumping && !state.paused){ state.jumping=true; state.vy=-14.5; beep(520,.08); }
}
document.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); jump(); }});
cv.addEventListener('pointerdown', jump);
document.getElementById('retryBtn').onclick = jump;

function loop(){
  requestAnimationFrame(loop);
  lvlEl.textContent='مرحله '+toFa(state.level);
  prog.style.width = Math.min(100, state.score/state.target*100)+'%';

  const running = !(state.dead || state.cleared || state.paused);
  if(running) startMusic(); else stopMusic();

  if(state.dead || state.cleared){ draw(); return; }
  if(state.paused){ draw(); return; }

  state.frame++;
  const diff=Number(document.getElementById('difficulty').value);
  state.speed=(6+state.score/320)*diff;
  state.groundOffset=(state.groundOffset+state.speed)%24;

  if(state.jumping){
    state.vy+=state.gravity; state.playerY+=state.vy;
    if(state.playerY>=170){ state.playerY=170; state.jumping=false; state.vy=0; }
  } else { state.legPhase += state.speed*0.05; }

  if(state.frame % Math.max(38, 85-state.level) === 0) spawnObstacle();
  state.obstacles.forEach(o=>o.x-=state.speed);
  state.obstacles=state.obstacles.filter(o=>o.x>-40);

  if(!state.studentSpawned && state.score>=state.target-70){
    state.studentSpawned=true;
    state.student={x:cv.width+30, y:170+6, w:26, h:34};
  }
  if(state.student) state.student.x -= state.speed;

  for(const o of state.obstacles){
    if(state.playerX+30>o.x && state.playerX+8<o.x+o.w && state.playerY+state.playerSize-8>o.y){
      state.dead=true; beep(120,.4,'sawtooth');
      bannerText.textContent='آقای حیدری کشته شد';
      bannerSub.textContent='امتیاز: '+toFa(Math.floor(state.score))+' — دوباره تلاش کن';
      best=Math.max(best,Math.floor(state.score)); localStorage.setItem('hbBest',best);
      bestEl.textContent='رکورد: '+toFa(best);
      banner.classList.add('show');
    }
  }
  if(!state.dead){
    state.score+=0.5;
    scoreEl.textContent=toFa(String(Math.floor(state.score)).padStart(4,'0'));
    const s=state.student;
    if(s && state.playerX+30>s.x && state.playerX+8<s.x+s.w){
      state.cleared=true; spawnDust(s.x+s.w/2, s.y+s.h/2); beep(700,.15,'sine');
      unlocked=Math.max(unlocked, state.level+1); localStorage.setItem('hbLevel',unlocked);
      bannerText.textContent='مرحله '+toFa(state.level)+' تموم شد!';
      bannerSub.textContent = state.level%10===0 ? 'شهر عوض شد — مرحله بعد' : 'برای ادامه بزن';
      banner.classList.add('show');
    }
  }
  dust.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; });
  dust=dust.filter(p=>p.life>0);
  draw();
}

function drawLeg(hipX,hipY,ang,len){
  ctx.save(); ctx.translate(hipX,hipY); ctx.rotate(ang);
  ctx.fillStyle='#3b5aa6'; ctx.fillRect(-4,0,8,len);
  ctx.restore();
}
function drawPlayer(){
  const x=state.playerX, y=state.playerY, s=state.playerSize;
  const hipY=s*0.55, legLen=s*0.5;
  let legA1, legA2;
  if(state.jumping){ legA1=-0.4; legA2=-0.15; }
  else { legA1=Math.sin(state.legPhase)*0.55; legA2=Math.sin(state.legPhase+Math.PI)*0.55; }
  ctx.save(); ctx.translate(x,y);
  drawLeg(s*0.32, hipY, legA1, legLen);
  drawLeg(s*0.62, hipY, legA2, legLen);
  // torso: checkered shirt (4-square pattern)
  const tw=s*0.62, th=s*0.4, tx=s*0.19, ty=s*0.18;
  const cols=['#c1121f','#f1faee'];
  for(let r=0;r<2;r++) for(let c=0;c<2;c++){
    ctx.fillStyle=cols[(r+c)%2];
    ctx.fillRect(tx+c*tw/2, ty+r*th/2, tw/2, th/2);
  }
  // arms
  ctx.strokeStyle='#c1121f'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(tx,ty+6); ctx.lineTo(tx-8, ty+th*0.9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tx+tw,ty+6); ctx.lineTo(tx+tw+8, ty+th*0.9); ctx.stroke();
  // head — enlarged so the face reads clearly
  const hx=s*0.5, hy=-s*0.1, hr=s*0.34;
  if(faceLoaded){ ctx.drawImage(face, hx-hr, hy, hr*2, hr*2); }
  else { ctx.fillStyle='#e8b98a'; ctx.beginPath(); ctx.arc(hx,hy+hr,hr,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}

function draw(){
  const w=worldFor(state.level);
  ctx.clearRect(0,0,cv.width,cv.height);
  const g=ctx.createLinearGradient(0,0,0,cv.height); g.addColorStop(0,w.sky1); g.addColorStop(1,w.sky2);
  ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);

  if(document.getElementById('graphics').checked){
    ctx.fillStyle=w.building;
    for(let i=0;i<9;i++){
      const bw=40+((i*53)%40), bx=(i*90 - state.groundOffset*0.4)%(cv.width+90)-90, bh=60+((i*37)%70);
      ctx.fillRect(bx, 150-bh, bw, bh);
      ctx.fillStyle=w.window;
      for(let wy=150-bh+8; wy<140; wy+=14) for(let wx=bx+6; wx<bx+bw-6; wx+=14) ctx.fillRect(wx,wy,6,8);
      ctx.fillStyle=w.building;
    }
  }
  ctx.fillStyle=w.road; ctx.fillRect(0,196,cv.width,24);
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.setLineDash([16,10]);
  ctx.beginPath(); ctx.moveTo(-state.groundOffset,208); ctx.lineTo(cv.width,208); ctx.stroke(); ctx.setLineDash([]);

  // cars
  state.obstacles.forEach(o=>{
    ctx.fillStyle=o.color; ctx.fillRect(o.x,o.y,o.w,o.h*0.7);
    ctx.fillRect(o.x+o.w*0.2,o.y-o.h*0.35,o.w*0.6,o.h*0.4);
    ctx.fillStyle='#1b1f3b'; ctx.beginPath(); ctx.arc(o.x+o.w*0.22,o.y+o.h*0.7,5,0,Math.PI*2);
    ctx.arc(o.x+o.w*0.78,o.y+o.h*0.7,5,0,Math.PI*2); ctx.fill();
  });

  drawPlayer();

  if(state.student){
    const s=state.student;
    ctx.fillStyle='#f4d19c'; ctx.beginPath(); ctx.arc(s.x+s.w/2, s.y+6, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#2b7a78'; ctx.fillRect(s.x+4, s.y+12, s.w-8, s.h-16);
    ctx.fillStyle='#e07a1f'; ctx.fillRect(s.x, s.y+14, 6, s.h-22);
  }

  dust.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life/40); ctx.fillStyle='#cfcfcf';
    ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; });

  if(state.paused && !state.dead && !state.cleared){
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#f1faee'; ctx.font='bold 20px Vazirmatn'; ctx.textAlign='center';
    ctx.fillText('متوقف شده', cv.width/2, cv.height/2);
  }
}

document.getElementById('pauseBtn').onclick=()=>{
  state.paused=!state.paused;
  document.getElementById('pauseBtn').textContent = state.paused ? '▶ ادامه' : '⏸ توقف';
};
document.getElementById('settingsBtn').onclick=()=>document.getElementById('modal').classList.add('open');
document.getElementById('closeSettings').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('resetProgress').onclick=()=>{
  unlocked=1; localStorage.setItem('hbLevel',1);
  newRun(1); document.getElementById('modal').classList.remove('open');
};
document.getElementById('downloadBtn').onclick=()=>{
  const blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='aghaye-heydari.html'; a.click();
};

loop();
</script>
</body>
</html>
